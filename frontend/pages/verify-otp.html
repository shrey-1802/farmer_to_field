<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verify OTP - KrishiNirnay AI Farm Advisory Platform">
  <title>Verify OTP — KrishiNirnay AI</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/sprout.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/ui.js"></script>
</head>
<body class="auth-body">
  <header class="auth-header">
    <div class="auth-brand">
      <div class="brand-logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 20h10"/>
          <path d="M10 20c0-4.4 3.6-8 8-8v-1a5 5 0 0 0-5-5c-2.4 0-4.5 1.5-5 3.5A5.5 5.5 0 0 0 2 12c0 4.4 3.6 8 8 8Z"/>
        </svg>
      </div>
      <span class="auth-brand-name">KrishiNirnay AI</span>
    </div>
    <div class="auth-header-actions">
      <button id="theme-toggle-btn" class="icon-button" aria-label="Toggle theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="auth-container">
    <section class="auth-card-single">
      <article class="auth-form-card">
        <div class="form-header">
          <a href="./login.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m15 18-6-6 6-6"/>
            </svg>
            Back to Mobile Entry
          </a>
          <h1 class="form-title">Enter Verification Code</h1>
          <p class="form-subtitle">
            We sent a 6-digit OTP to <strong id="display-phone">+91 ••••• •••••</strong>
          </p>
          <div style="background: rgba(22, 163, 74, 0.12); color: #15803d; border: 1px solid rgba(22, 163, 74, 0.3); font-weight: 700; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; margin-top: 8px; text-align: center;">
            💡 Demo Mode: Enter Code <strong>123456</strong> to continue
          </div>
        </div>

        <form id="otp-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="otp-input-0" class="form-label">6-Digit Code</label>
            <div class="otp-inputs" role="group" aria-label="6-digit verification code">
              <input type="text" id="otp-input-0" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" required autocomplete="one-time-code">
              <input type="text" id="otp-input-1" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
              <input type="text" id="otp-input-2" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
              <input type="text" id="otp-input-3" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
              <input type="text" id="otp-input-4" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
              <input type="text" id="otp-input-5" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
            </div>
            <p id="otp-error" class="input-error" role="alert" style="display: none;"></p>
          </div>

          <button type="submit" id="verify-btn" class="btn btn-primary btn-block">
            <span class="btn-text">Verify & Continue</span>
            <span class="btn-loader" aria-hidden="true" style="display: none;"></span>
          </button>
        </form>

        <footer class="otp-timer-section">
          <p id="timer-text">Resend code in <span id="countdown-seconds">60</span>s</p>
          <button type="button" id="resend-otp-btn" class="btn btn-link" disabled>
            Didn't receive code? Resend OTP
          </button>
        </footer>
      </article>
    </section>
  </main>

  <footer class="auth-page-footer">
    <p>&copy; 2026 KrishiNirnay AI — Farm-to-Field Autonomous Advisory</p>
  </footer>

  <script type="module" src="../js/otp.js"></script>
</body>
</html>
