name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Static Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend structure and file integrity
        run: |
          echo "Verifying KrishiNirnay AI frontend structure..."
          test -f frontend/index.html || { echo "Missing frontend/index.html"; exit 1; }
          test -d frontend/css || { echo "Missing frontend/css"; exit 1; }
          test -d frontend/js || { echo "Missing frontend/js"; exit 1; }
          test -d frontend/pages || { echo "Missing frontend/pages"; exit 1; }
          echo "Frontend files verified successfully."

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
