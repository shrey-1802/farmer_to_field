name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Static Files & Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend structure and file integrity
        run: |
          echo "Verifying KrishiNirnay AI frontend structure..."
          test -f frontend/index.html || { echo "Missing frontend/index.html"; exit 1; }
          test -d frontend/css || { echo "Missing frontend/css"; exit 1; }
          test -d frontend/js || { echo "Missing frontend/js"; exit 1; }
          test -d frontend/pages || { echo "Missing frontend/pages"; exit 1; }
          test -f index.html || { echo "Missing root index.html"; exit 1; }
          echo "Frontend files verified successfully."

      - name: Run Static Compliance Checks (Section 55 & 56)
        run: |
          echo "=== Running Static Compliance Checks ==="
          python3 - << 'EOF'
          import glob
          import os
          import re
          import sys

          violations = []

          # Check HTML files for absolute root paths (href="/..." or src="/...")
          html_files = glob.glob("**/*.html", recursive=True)
          for hf in html_files:
              if ".git" in hf:
                  continue
              with open(hf, "r", encoding="utf-8") as f:
                  content = f.read()
              bad_links = re.findall(r'(?:href|src)=["\'](/[^/"\'][^"\']*)["\']', content)
              if bad_links:
                  violations.append(f"{hf}: Found illegal absolute root links: {bad_links}")

          # Check JS files for Node runtime constructs (require, process.env)
          js_files = glob.glob("js/*.js") + glob.glob("frontend/js/*.js")
          for jf in js_files:
              with open(jf, "r", encoding="utf-8") as f:
                  content = f.read()
              if re.search(r'\bprocess\.env\b', content) or re.search(r'\brequire\([\'"]', content):
                  violations.append(f"{jf}: Found illegal Node runtime construct")

          if violations:
              print("✕ Static checks failed with violations:")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)
          else:
              print("✓ All static compliance checks passed cleanly: 100% relative paths and zero Node dependencies.")
          EOF

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
